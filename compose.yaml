services:
  enqueue-fe:
    image: enqueue-fe:latest
    ports:
      - 5173:5173
    env_file: ../enqueue-fe/.env
  enqueue:
    image: enqueue:latest
    ports:
      - 8080:8080
    env_file: ./.env
  
  redis:
    image: redis:latest
    ports:
      - 6379:6379 

  postgres:
    image: postgres:18
    ports:
      - 5432:5432
    environment: 
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker

volumes:
  postgres-data:
